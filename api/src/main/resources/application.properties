spring.application.name=novel-reader-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/novel_reader}
spring.datasource.username=${DATABASE_USERNAME:novel_reader}
spring.datasource.password=${DATABASE_PASSWORD:novel_reader_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/api
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.storage.local-path=${STORAGE_LOCAL_PATH:../data}
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.supabase-url=${SUPABASE_URL:}
app.storage.supabase-service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.storage.supabase-bucket=${SUPABASE_STORAGE_BUCKET:reader}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.tts.azure-key=${AZURE_SPEECH_KEY:}
app.tts.azure-region=${AZURE_SPEECH_REGION:}
app.tts.fpt-api-key=${FPT_AI_API_KEY:}
app.tts.saydi-api-key=${SAYDI_API_KEY:}
app.tts.edge-python-command=${EDGE_TTS_PYTHON:python}
app.tts.edge-enabled=${EDGE_TTS_ENABLED:false}
